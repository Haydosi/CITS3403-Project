{% extends "base.html" %}

{% block title %}MyMoney - Login<{% endblock %} 

{% block page_css %} 
<style>
    .login-page-content {

    min-height: 100vh;

    margin-left: 320px;

    display: flex;

    align-items: center;

    justify-content: center;

    }

    .login-card {
    width: min(100%, 460px);
    }
    </style>
{% endblock %}


{% block content %}
<main class=login-page-content>
    <div class="login-card mx-auto">
        <h1>Login</h1>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Enter password">
            </div>

            <button type="button" class="btn btn-login w-100">Sign in</button>
        </form>

    </div>
</main>
{% endblock %}

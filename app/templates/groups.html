{% extends "base.html" %}

{% block title %}MyMoney - Groups{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/groups.css') }}">
{% endblock %}

{% block content %}
<main class="main-content">
    <section class="top-bar anim-in">
        <div>
            <h2 class="page-title">Groups</h2>
            <p class="page-subtitle">Create a group, invite members by email, and manage roles.</p>
        </div>
        <button type="button" class="btn btn-accent" id="openCreateGroup">
            <i class="bi bi-plus-lg"></i> New group
        </button>
    </section>

    <div id="groupsAlert" class="alert alert-danger py-2 px-3 mb-3 d-none" role="alert"></div>

    <div id="groupsList" class="groups-list"></div>
</main>

<div class="modal fade" id="createGroupModal" tabindex="-1" aria-labelledby="createGroupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content grp-modal-surface">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="createGroupModalLabel">Create group</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <label class="form-label" for="newGroupName">Group name</label>
                <input type="text" class="form-control" id="newGroupName" maxlength="50" placeholder="e.g. Weekend savers">
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-accent" id="createGroupSave">Create</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="inviteModal" tabindex="-1" aria-labelledby="inviteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content grp-modal-surface">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="inviteModalLabel">Invite member</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="inviteGroupId" value="">
                <label class="form-label" for="inviteEmail">Their account email</label>
                <input type="email" class="form-control" id="inviteEmail" placeholder="friend@example.com">
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-accent" id="inviteSave">Send invite</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="renameModal" tabindex="-1" aria-labelledby="renameModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content grp-modal-surface">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="renameModalLabel">Rename group</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="renameGroupId" value="">
                <label class="form-label" for="renameGroupName">New name</label>
                <input type="text" class="form-control" id="renameGroupName" maxlength="50">
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-accent" id="renameSave">Save</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block page_js %}
<script src="{{ url_for('static', filename='js/groups.js') }}"></script>
{% endblock %}

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyMoney{% endblock %}</title>
    <!-- Bootstrap 5 CSS — layout grid, utilities, modal, form components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons — icon font used throughout the sidebar and cards -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts: Plus Jakarta Sans (body) + Bricolage Grotesque (headings/numbers) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Shared base styles (variables, sidebar, layout) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">

    {% block page_css %}{% endblock %}

</head>

<body>

    {% block sidebar %}{% include "partials/sidebar.html" %}{% endblock %}
    {% block content %}{% endblock %}

    <!-- Bootstrap JS bundle (includes Popper) — required for modal, dropdowns -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jquery here so all templates that extend base.html can use it -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    {% block page_js %}{% endblock %}

</body>

</html>

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMoney — Login</title>
    <!-- Bootstrap 5 CSS — layout grid, utilities, modal, form components -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons — icon font used throughout the sidebar and cards -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts: Plus Jakarta Sans (body) + Bricolage Grotesque (headings/numbers) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Dashboard-specific styles (colours, layout, components) 
    right now just borrowing that since I'm not sure how we'll be changing this later-->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

    <!-- temp style so sidebar doesn't cover everything -->
    <style>
        .login-page-content {

            min-height: 100vh;

            margin-left: 320px;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .login-card {
            width: min(100%, 460px);
        }
    </style>
</head>

<body>

    {%include "partials/sidebar.html"%}

    <main class=login-page-content>
        <div class="login-card mx-auto">
            <h1>Login</h1>

            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password">
                </div>

                <button type="button" class="btn btn-login w-100">Sign in</button>
            </form>

        </div>
    </main>
</body>

</html>
